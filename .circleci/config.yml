
version: 2.1
executors:
  python-executor:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/repo
    environment:
      PATH: /home/circleci/.local/bin:/home/circleci/.pyenv/shims:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
commands:
  install-uv-deps:
    steps:
      - run:
          name: Install dependencies
          command: |
            curl -Ls https://astral.sh/uv/install.sh | sh
            if [ -n "$SOCKET_AUTH_TOKEN" ]; then
              export PIP_INDEX_URL="https://socket:${SOCKET_AUTH_TOKEN}@pkgfw.standardmetrics.dev/pypi/simple"
              export UV_DEFAULT_INDEX="https://socket:${SOCKET_AUTH_TOKEN}@pkgfw.standardmetrics.dev/pypi/simple"
              # uv.lock pins literal download URLs, so a --frozen sync bypasses the
              # index override above. Re-lock against the firewall, install, then
              # discard the relocked file so the committed lock stays untouched.
              uv lock
              uv sync --locked
              git checkout -- uv.lock
            else
              uv sync --frozen
            fi
jobs:
  lint:
    executor: python-executor
    steps:
      - checkout
      - install-uv-deps
      - run:
          name: Run Ruff
          command: |
            uv run ruff check src/
            uv run ruff format --check src/
      - run:
          name: Run Pyright
          command: |
            uv run pyright src/
  test:
    executor: python-executor
    steps:
      - checkout
      - install-uv-deps
      - run:
          name: Run Tests
          command: |
            uv run pytest tests/
  publish-pypi:
    executor: python-executor
    steps:
      - checkout
      - install-uv-deps
      - run:
          name: Build and publish to PyPI
          command: |
            uv build
            uv publish --token $PYPI_API_TOKEN
  docker-build-push:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            DOCKER_BUILDKIT=1 docker build --secret id=socket_auth_token,env=SOCKET_AUTH_TOKEN -t $DOCKERHUB_USERNAME/smx-mcp:latest .
      - run:
          name: Login to DockerHub
          command: |
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_CI_USERNAME --password-stdin
      - run:
          name: Push Docker image
          command: |
            docker push $DOCKERHUB_USERNAME/smx-mcp:latest
workflows:
  version: 2
  test-and-publish:
    jobs:
      - lint:
          context: socket-firewall
          filters:
            tags:
              only: /.*/
      - test:
          context: socket-firewall
          filters:
            tags:
              only: /.*/
      - publish-pypi:
          context: socket-firewall
          requires:
            - lint
            - test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - docker-build-push:
          context: socket-firewall
          requires:
            - lint
            - test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
